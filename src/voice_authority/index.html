<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>UCII Voice Authority Agent</title>
</head>
<body>
    <main>
        <h1>UCII Voice Authority Agent</h1>

        <p>
            Conversation is the interface. UCII is the control plane.
        </p>

        <section aria-labelledby="voice-proof-heading">
            <h2 id="voice-proof-heading">AssemblyAI Voice Proof</h2>

            <dl>
                <dt>Microphone</dt>
                <dd id="microphone-status">NOT STARTED</dd>

                <dt>AssemblyAI session</dt>
                <dd id="assemblyai-status">NOT CONNECTED</dd>

                <dt>Finalized user turn</dt>
                <dd id="finalized-turn">NONE</dd>

                <dt>Consequential execution</dt>
                <dd id="execution-status">DISABLED</dd>
            </dl>
        </section>

        <p>
            Understanding a request does not create authority to execute it.
        </p>
    </main>
</body>
</html>

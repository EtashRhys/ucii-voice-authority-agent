<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">UCII Voice Authority Agent futuristic proof UI concept</title>
<desc id="desc">Dark futuristic dashboard with separate human and UCII voice waveforms, live transcripts, authority chain, current authority, AssemblyAI metrics, evidence and export controls.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030914"/><stop offset="1" stop-color="#071426"/></linearGradient>
  <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#5b5cff"/><stop offset="1" stop-color="#f04cff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17304a" stroke-width="1" opacity=".18"/></pattern>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e9f5ff}.muted{fill:#7895b2}.cyan{fill:#29ddff}.violet{fill:#c45cff}.green{fill:#3fffc2}.amber{fill:#ffc857}.red{fill:#ff5470}.panel{fill:#071322;stroke:#1d6386;stroke-width:1.5}.panel2{fill:#0a1024;stroke:#623ca3;stroke-width:1.5}.small{font-size:14px}.body{font-size:17px}.label{font-size:15px;font-weight:700;letter-spacing:1px}.h2{font-size:24px;font-weight:700}.title{font-size:31px;font-weight:800;letter-spacing:1px}.chip{fill:#0b2234;stroke:#286b8c}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<!-- header -->
<rect x="28" y="25" width="1544" height="75" rx="14" fill="#06101d" stroke="#183b57"/>
<circle cx="72" cy="62" r="24" fill="none" stroke="#26dfff" stroke-width="2"/><path d="M55 67L61 48 68 75 76 43 83 70 91 55" class="line" stroke="#26dfff" stroke-width="2"/>
<text x="110" y="58" class="title">UCII</text><text x="110" y="80" class="small muted" letter-spacing="2">VOICE AUTHORITY AGENT</text>
<text x="525" y="68" class="label muted">SPEAK  ›  UNDERSTAND  ›  GOVERN  ›  ACT</text>
<text x="1340" y="54" class="h2">AssemblyAI</text><text x="1340" y="78" class="small muted">VOICE RUNTIME</text>
<!-- left rail -->
<rect x="28" y="120" width="205" height="840" rx="14" class="panel"/>
<text x="54" y="165" class="label cyan">◉  VOICE CONSOLE</text><text x="54" y="213" class="body muted">▤  Live Transcript</text><text x="54" y="260" class="body muted">◇  Agent Actions</text><text x="54" y="307" class="body muted">◈  Identity &amp; Auth</text><text x="54" y="354" class="body muted">⬡  Governance</text><text x="54" y="401" class="body muted">＋  System Status</text><text x="54" y="448" class="body muted">▥  Evidence</text><text x="54" y="495" class="body muted">⇩  Export</text>
<text x="54" y="850" class="small muted" letter-spacing="2">CAPABILITY ≠ AUTHORITY</text><text x="54" y="878" class="small muted">Identity can remain valid</text><text x="54" y="900" class="small muted">after authority is revoked.</text>
<!-- main -->
<text x="270" y="145" class="h2">VOICE CONSOLE</text><circle cx="450" cy="139" r="6" fill="#3fffc2" filter="url(#glow)"/><text x="466" y="145" class="label green">LISTENING</text>
<!-- input waveform -->
<rect x="265" y="165" width="500" height="185" rx="16" class="panel"/><text x="290" y="197" class="label cyan">YOUR VOICE — INPUT</text><text x="690" y="197" class="small red">● LIVE</text>
<path d="M290 265 L300 250 310 282 320 228 330 292 340 245 350 274 360 215 370 302 380 238 390 285 400 225 410 294 420 242 430 278 440 207 450 310 460 235 470 290 480 220 490 300 500 246 510 275 520 230 530 292 540 240 550 281 560 217 570 304 580 244 590 277 600 231 610 289 620 248 630 275 640 236 650 286 660 252 670 270 680 242 690 280 700 255 715 268 735 258" class="line" stroke="#24dcff" stroke-width="3" filter="url(#glow)"/>
<text x="290" y="326" class="small muted">Speaking…  •  24 kHz PCM16 native path</text>
<!-- output waveform -->
<rect x="785" y="165" width="500" height="185" rx="16" class="panel2"/><text x="810" y="197" class="label violet">UCII VOICE — OUTPUT</text><text x="1185" y="197" class="small violet">RESPONDING</text>
<path d="M810 266 L820 258 830 279 840 242 850 288 860 250 870 275 880 225 890 297 900 240 910 286 920 233 930 292 940 247 950 276 960 218 970 303 980 241 990 290 1000 229 1010 294 1020 246 1030 278 1040 235 1050 288 1060 250 1070 273 1080 228 1090 298 1100 244 1110 282 1120 234 1130 291 1140 250 1150 275 1160 240 1170 286 1180 252 1190 272 1200 246 1210 280 1220 257 1255 266" class="line" stroke="#d450ff" stroke-width="3" filter="url(#glow)"/>
<text x="810" y="326" class="small muted">Real playback trace • source track retained independently</text>
<!-- transcripts -->
<rect x="265" y="370" width="500" height="165" rx="16" class="panel"/><text x="290" y="402" class="label cyan">LIVE TRANSCRIPT — YOU</text><text x="290" y="440" class="body">“Allow this agent to purchase up to $50</text><text x="290" y="466" class="body">of compute for the next hour.”</text><text x="290" y="505" class="small green">FINALIZED</text><text x="665" y="505" class="small muted">Confidence 0.97</text>
<rect x="785" y="370" width="500" height="165" rx="16" class="panel2"/><text x="810" y="402" class="label violet">UCII RESPONSE</text><text x="810" y="440" class="body">“This changes authority. Step-up verification</text><text x="810" y="466" class="body">is required before UCII can evaluate the grant.”</text><text x="810" y="505" class="small violet">VOICE OUTPUT ACTIVE</text>
<!-- authority chain -->
<rect x="265" y="555" width="1020" height="125" rx="16" fill="#071322" stroke="#244f70" stroke-width="1.5"/><text x="290" y="585" class="label">LIVE AUTHORITY CHAIN</text>
<g font-size="13" font-weight="700"><rect x="290" y="610" width="105" height="38" rx="19" fill="#0d3945" stroke="#29ddff"/><text x="319" y="634" class="cyan">VOICE ✓</text><rect x="410" y="610" width="105" height="38" rx="19" fill="#0d3945" stroke="#29ddff"/><text x="438" y="634" class="cyan">INTENT ✓</text><rect x="530" y="610" width="115" height="38" rx="19" fill="#103b32" stroke="#3fffc2"/><text x="548" y="634" class="green">IDENTITY ✓</text><rect x="660" y="610" width="125" height="38" rx="19" fill="#453616" stroke="#ffc857"/><text x="678" y="634" class="amber">STEP-UP …</text><rect x="800" y="610" width="125" height="38" rx="19" fill="#121d2b" stroke="#49657d"/><text x="818" y="634" class="muted">AUTHORITY</text><rect x="940" y="610" width="125" height="38" rx="19" fill="#121d2b" stroke="#49657d"/><text x="958" y="634" class="muted">DECISION</text><rect x="1080" y="610" width="145" height="38" rx="19" fill="#121d2b" stroke="#49657d"/><text x="1098" y="634" class="muted">EXECUTION</text></g>
<!-- lower cards -->
<rect x="265" y="700" width="320" height="235" rx="16" class="panel"/><text x="290" y="733" class="label cyan">HEARD / UNDERSTOOD / REQUEST</text><text x="290" y="770" class="small muted">HEARD</text><text x="370" y="770" class="small">Finalized speech</text><text x="290" y="802" class="small muted">UNDERSTOOD</text><text x="390" y="802" class="small">Bounded delegation</text><text x="290" y="834" class="small muted">REQUEST</text><text x="370" y="834" class="small">GRANT</text><text x="290" y="866" class="small muted">LIMIT</text><text x="370" y="866" class="small">$50 / compute</text><text x="290" y="898" class="small muted">EXPIRY</text><text x="370" y="898" class="small">1 hour</text>
<rect x="605" y="700" width="330" height="235" rx="16" class="panel"/><text x="630" y="733" class="label green">CURRENT AUTHORITY</text><text x="630" y="772" class="small muted">UCII Identity</text><text x="825" y="772" class="small green">VERIFIED ✓</text><text x="630" y="807" class="small muted">Delegated authority</text><text x="825" y="807" class="small amber">PENDING</text><text x="630" y="842" class="small muted">Human governance</text><text x="825" y="842" class="small green">ACTIVE ✓</text><text x="630" y="877" class="small muted">Step-up</text><text x="825" y="877" class="small amber">REQUIRED</text><text x="630" y="912" class="small muted">Executor</text><text x="825" y="912" class="small">NOT INVOKED</text>
<rect x="955" y="700" width="330" height="235" rx="16" class="panel2"/><text x="980" y="733" class="label violet">SECURITY EVIDENCE</text><text x="980" y="772" class="small muted">Ceremony</text><text x="1120" y="772" class="small">cer-8f21…</text><text x="980" y="807" class="small muted">Session</text><text x="1120" y="807" class="small">ses-7f3a…</text><text x="980" y="842" class="small muted">Step-up evidence</text><text x="1120" y="842" class="small amber">AWAITING</text><text x="980" y="877" class="small muted">Lifecycle auth</text><text x="1120" y="877" class="small">NOT ISSUED</text><text x="980" y="912" class="small muted">Provenance</text><text x="1120" y="912" class="small green">READY</text>
<!-- right rail -->
<rect x="1310" y="120" width="262" height="840" rx="14" class="panel"/><text x="1335" y="160" class="label">SESSION INFO</text><text x="1335" y="198" class="small muted">Status</text><text x="1470" y="198" class="small green">● ACTIVE</text><text x="1335" y="230" class="small muted">Runtime</text><text x="1450" y="230" class="small">AssemblyAI</text><text x="1335" y="262" class="small muted">Language</text><text x="1485" y="262" class="small">en-US</text>
<line x1="1335" y1="290" x2="1545" y2="290" stroke="#214761"/><text x="1335" y="325" class="label">REAL-TIME METRICS</text><text x="1335" y="360" class="small muted">STT confidence</text><text x="1495" y="360" class="small">0.97</text><text x="1335" y="392" class="small muted">Connection</text><text x="1485" y="392" class="small green">STABLE</text><text x="1335" y="424" class="small muted">Turn</text><text x="1488" y="424" class="small green">FINAL</text>
<line x1="1335" y1="452" x2="1545" y2="452" stroke="#214761"/><text x="1335" y="487" class="label">EXPORT</text><rect x="1335" y="510" width="210" height="42" rx="9" class="chip"/><text x="1360" y="536" class="small">ARCHIVAL / NATIVE</text><rect x="1335" y="563" width="210" height="42" rx="9" class="chip"/><text x="1360" y="589" class="small">HIGH QUALITY</text><rect x="1335" y="616" width="210" height="42" rx="9" class="chip"/><text x="1360" y="642" class="small">STANDARD</text><rect x="1335" y="669" width="210" height="42" rx="9" class="chip"/><text x="1360" y="695" class="small">COMPACT</text><text x="1335" y="735" class="small muted">Separate HUMAN + UCII</text><text x="1335" y="757" class="small muted">source tracks retained.</text>
<line x1="1335" y1="785" x2="1545" y2="785" stroke="#214761"/><text x="1335" y="825" class="body" font-style="italic">“Capability is not</text><text x="1335" y="852" class="body" font-style="italic">authority.”</text><text x="1335" y="900" class="small cyan">AssemblyAI understands.</text><text x="1335" y="924" class="small violet">UCII governs.</text>
</svg>